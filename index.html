<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IS KPI Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f8f9;--bg3:#eef0f2;--bg4:#e4e6ea;
  --sidebar:#f0f2f4;--line:#e2e4e8;--line2:#c8ccd4;
  --text:#1a1d23;--text2:#4a5060;--text3:#8a90a0;
  --primary:#40b680;--primary-dark:#2d9065;--primary-light:#e8f7f0;--primary-mid:#b2e4cc;
  --blue:#0080EE;--teal:#00C093;--amber:#FFAA00;--red:#e05050;
  --sans:'Meiryo','メイリオ','Hiragino Kaku Gothic ProN',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;min-height:100vh}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.sidebar{background:var(--sidebar);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:28px 32px;overflow-x:hidden}
.logo{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line2)}
.logo-mark{width:34px;height:34px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.logo-text{font-size:14px;font-weight:700;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px}
.nav-section{display:flex;flex-direction:column;gap:6px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;padding-left:2px}
/* upload */
.fetch-box{border:1px solid var(--line2);border-radius:8px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px}
.fetch-status{font-size:11px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;background:var(--bg2);color:var(--text3)}
.fetch-status.ok{background:var(--primary-light);color:var(--primary-dark)}
.fetch-status.err{background:#fdf0f0;color:var(--red)}
.fetch-status.loading{background:#fff8e6;color:#a07000}
.fetch-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:currentColor}
.fetch-btn{background:var(--primary);border:none;border-radius:6px;color:#fff;font-size:11px;font-weight:700;font-family:var(--sans);padding:8px;width:100%;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.fetch-btn:hover{background:var(--primary-dark)}
.fetch-btn:disabled{background:var(--primary-mid);cursor:not-allowed}
.spin{display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* form elements */
.filter-group{display:flex;flex-direction:column;gap:3px}
.filter-group label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;padding-left:2px}
select,input[type=date]{background:#fff;border:1px solid var(--line2);border-radius:6px;color:var(--text);font-size:12px;font-family:var(--sans);padding:6px 10px;width:100%;outline:none;transition:border-color .2s;appearance:none}
select:focus,input[type=date]:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(64,182,128,.15)}
/* pills */
.pill-group{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--sans)}
.pill:hover{border-color:var(--primary-mid);color:var(--primary-dark)}
.pill.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
/* buttons */
.apply-btn{background:var(--primary);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;font-family:var(--sans);padding:11px;width:100%;cursor:pointer;transition:background .2s}
.apply-btn:hover{background:var(--primary-dark)}
.apply-btn:active{transform:scale(.98)}
.sec-btn{background:#fff;border:1px solid var(--line2);border-radius:8px;color:var(--text2);font-size:11px;font-weight:700;font-family:var(--sans);padding:8px 10px;width:100%;cursor:pointer;transition:all .15s;text-align:center}
.sec-btn:hover{border-color:var(--primary-mid);color:var(--primary)}
/* page header */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700;color:var(--text)}
.page-sub{font-size:11px;color:var(--text3);margin-top:3px}
.status-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--primary-light);border:1px solid var(--primary-mid);border-radius:20px;padding:5px 12px;color:var(--primary-dark);font-weight:700}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
/* kpi cards */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;position:relative;overflow:hidden;transition:box-shadow .2s}
.kpi-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.c-primary::before{background:var(--primary)}
.kpi-card.c-blue::before{background:var(--blue)}
.kpi-card.c-teal::before{background:var(--teal)}
.kpi-card.c-amber::before{background:var(--amber)}
.kpi-card.c-gray::before{background:#64748b}
.kpi-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.06em;margin-bottom:8px;text-transform:uppercase}
.kpi-value{font-size:28px;font-weight:700;color:var(--text);line-height:1;margin-bottom:5px}
.kpi-meta{font-size:11px;color:var(--text3)}
/* charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.chart-card.full{grid-column:1/-1}
.chart-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.chart-title span{font-size:10px;color:var(--text3);font-weight:400}
/* table */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:10px 14px;text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;background:var(--bg2)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--text2);font-size:12px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg2)}
tbody tr.total-row td{color:var(--text);font-weight:700;background:var(--primary-light);border-top:1px solid var(--primary-mid)}
/* progress */
.pbar{display:flex;align-items:center;gap:8px}
.pbar-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;min-width:60px}
.pbar-fill{height:100%;border-radius:3px}
/* member tabs */
.member-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.member-tab{font-size:12px;padding:6px 16px;border-radius:6px;border:1px solid var(--line2);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--sans)}
.member-tab:hover{border-color:var(--primary-mid);color:var(--primary)}
.member-tab.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
/* empty */
.empty{text-align:center;padding:80px 20px}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty-title{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:8px}
.empty-text{font-size:12px;line-height:1.8;max-width:320px;margin:0 auto;color:var(--text3)}
/* section head */
.section-head{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--primary-light);display:flex;align-items:center;gap:8px}
.section-head::before{content:'';display:block;width:3px;height:14px;background:var(--primary);border-radius:2px}
/* status */
.ok{color:var(--primary);font-weight:700}
.warn{color:var(--amber);font-weight:700}
.bad{color:var(--red);font-weight:700}
/* legend */
.legend-strip{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--text3)}
.legend-strip span{display:flex;align-items:center;gap:5px}
.ldot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.ldot.r{border-radius:50%}
/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
 
/* ── TEAM EDITOR ───────────────────────────────── */
.team-editor-overlay{position:fixed;inset:0;background:rgba(26,29,35,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.team-editor{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.te-header{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.te-title{font-size:16px;font-weight:700;color:var(--text)}
.te-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;line-height:1;padding:4px}
.te-close:hover{color:var(--text)}
.te-body{padding:20px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.te-hint{font-size:12px;color:var(--text3);line-height:1.6;background:var(--primary-light);border-radius:8px;padding:10px 14px;border-left:3px solid var(--primary)}
/* unassigned pool */
.te-pool-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.te-pool{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:10px;background:var(--bg2);border-radius:8px;border:1.5px dashed var(--line2)}
.te-pool.drag-over{border-color:var(--primary);background:var(--primary-light)}
/* member chip */
.m-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px;background:#fff;border:1px solid var(--line2);cursor:grab;user-select:none;transition:box-shadow .15s}
.m-chip:hover{box-shadow:0 2px 6px rgba(0,0,0,.1)}
.m-chip.dragging{opacity:.4}
.m-chip-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.tgt-input{width:48px;font-size:10px;font-family:var(--sans);border:1px solid var(--line2);border-radius:4px;padding:2px 4px;color:var(--text2);background:#fff;margin-left:2px;outline:none}
.tgt-input:focus{border-color:var(--primary)}
/* team slots */
.te-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.te-team-slot{border:1.5px solid var(--line2);border-radius:10px;overflow:hidden}
.te-team-slot.drag-over{border-color:var(--primary)}
.te-team-header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.te-team-color{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.te-team-name-input{flex:1;border:none;outline:none;font-size:13px;font-weight:700;font-family:var(--sans);background:transparent;color:var(--text)}
.te-team-name-input::placeholder{color:var(--text3);font-weight:400}
.te-team-delete{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px}
.te-team-delete:hover{color:var(--red)}
.te-team-members{min-height:48px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px}
.te-add-team{border:1.5px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;font-size:12px;color:var(--text3);transition:all .15s}
.te-add-team:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
/* footer */
.te-footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.te-cancel{background:#fff;border:1px solid var(--line2);border-radius:8px;font-size:12px;font-family:var(--sans);padding:9px 20px;cursor:pointer;color:var(--text2)}
.te-apply{background:var(--primary);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;font-family:var(--sans);padding:9px 24px;cursor:pointer}
.te-apply:hover{background:var(--primary-dark)}
/* team badge in table */
.team-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
/* team tabs row */
.team-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.team-tab{font-size:12px;padding:6px 16px;border-radius:6px;border:1.5px solid var(--line2);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;font-family:var(--sans);display:flex;align-items:center;gap:6px}
.team-tab-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.team-tab:hover{border-color:var(--line2)}
.team-tab.active{font-weight:700}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">IS</div>
    <div><div class="logo-text">KPI Dashboard</div><div class="logo-sub">Inside Sales</div></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">データ取得</div>
    <div class="fetch-box">
      <div style="font-size:11px;color:var(--text2);font-weight:700">営業活動実績報告フォーム</div>
      <div style="font-size:10px;color:var(--text3);line-height:1.5">Googleスプレッドシートから<br>最新データを取得します</div>
      <div class="fetch-status" id="fetchStatus">
        <span class="fetch-dot"></span>
        <span id="fetchStatusText">未取得</span>
      </div>
      <button class="fetch-btn" id="fetchBtn" onclick="fetchSheetData()">
        <span id="fetchBtnIcon">↻</span> データを更新
      </button>
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-label">チーム編成</div>
    <button class="sec-btn" id="openTeamEditor" onclick="openEditor()">チームを設定する</button>
    <div id="teamSummary" style="margin-top:6px;font-size:11px;color:var(--text3);line-height:1.8"></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">集計単位</div>
    <div class="pill-group" id="periodPills">
      <button class="pill active" data-period="daily">デイリー</button>
      <button class="pill" data-period="weekly">週次</button>
      <button class="pill" data-period="monthly">月次</button>
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-label">期間フィルター</div>
    <div class="filter-group"><label>開始日</label><input type="date" id="dateFrom"></div>
    <div class="filter-group" style="margin-top:6px"><label>終了日</label><input type="date" id="dateTo"></div>
    <div class="pill-group" style="margin-top:8px" id="quickRangePills">
      <button class="pill" data-range="7">直近7日</button>
      <button class="pill" data-range="30">直近30日</button>
      <button class="pill" data-range="all">全期間</button>
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-label">表示モード</div>
    <div class="pill-group" id="viewModePills">
      <button class="pill active" data-view="individual">個人</button>
      <button class="pill" data-view="team">チーム全体</button>
      <button class="pill" data-view="teamgroup">チーム別比較</button>
      <button class="pill" data-view="compare">メンバー比較</button>
    </div>
  </div>
  <button class="apply-btn" onclick="renderDashboard()">表示を更新</button>
</aside>
 
<main class="main">
  <div id="emptyState" class="empty">
    <div class="empty-icon">📋</div>
    <div class="empty-title">フォーム回答待ち</div>
    <div class="empty-text">Googleスプレッドシートへの接続は成功しています。<br>メンバーがフォームに回答すると、「データを更新」ボタンを押すだけでここに表示されます。</div>
  </div>
  <div id="dashboardContent" style="display:none"></div>
</main>
</div>
 
<!-- TEAM EDITOR MODAL -->
<div class="team-editor-overlay" id="editorOverlay" style="display:none" onclick="if(event.target===this)closeEditor()">
  <div class="team-editor">
    <div class="te-header">
      <div class="te-title">チーム編成を設定</div>
      <button class="te-close" onclick="closeEditor()">✕</button>
    </div>
    <div class="te-body">
      <div class="te-hint">メンバーをドラッグ＆ドロップでチームに割り当てられます。チーム名はクリックして編集できます。各メンバーの右側の数値欄で<b>月次アポ目標</b>を設定できます。</div>
      <div>
        <div class="te-pool-label">未割り当てメンバー</div>
        <div class="te-pool" id="unassignedPool" ondragover="onDragOver(event,null)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,null)"></div>
      </div>
      <div>
        <div class="te-pool-label">チーム</div>
        <div class="te-teams" id="teTeams"></div>
        <div class="te-add-team" onclick="addTeam()">＋ チームを追加</div>
      </div>
    </div>
    <div class="te-footer">
      <button class="te-cancel" onclick="closeEditor()">キャンセル</button>
      <button class="te-apply" onclick="applyTeams()">保存して閉じる</button>
    </div>
  </div>
</div>
 
<script>
// ── STATE ────────────────────────────────────────────────
const state={
  members:{},
  // 初期チーム編成（画像より）
  teams:{
    'team_chikano':{name:'近野チーム',color:'#40b680'},
    'team_matsumoto':{name:'松本チーム',color:'#0080EE'},
  },
  memberTeam:{
    '近野':'team_chikano','橋爪':'team_chikano','中井':'team_chikano',
    '山口':'team_chikano','小谷':'team_chikano','大澤':'team_chikano',
    '神元':'team_chikano','宮':'team_chikano','渡辺':'team_chikano',
    '松本':'team_matsumoto','中尾':'team_matsumoto','峰尾':'team_matsumoto',
    '野村':'team_matsumoto','金子':'team_matsumoto','中西':'team_matsumoto',
    '小山':'team_matsumoto','安保':'team_matsumoto','坂上':'team_matsumoto',
    '堤':'team_matsumoto',
  },
  // 個人アポ月次目標（括弧内の数値）
  memberApoTarget:{
    '近野':2,'橋爪':3.5,'中井':1,'山口':1,'小谷':1,
    '大澤':0.5,'神元':0.5,'宮':0.5,'渡辺':0,
    '松本':2,'中尾':2,'峰尾':1,'野村':1,'金子':1,
    '中西':1,'小山':0.5,'安保':1,'坂上':1,'堤':0.5,
  },
  period:'daily',
  viewMode:'individual',
  activeMember:null,
  activeTeamTab:null,
};
 
// team colors palette
const TEAM_COLORS=['#40b680','#0080EE','#FFAA00','#e05050','#9b59b6','#e67e22','#1abc9c','#e91e8c'];
 
// ── GOOGLE SHEETS CONFIG ─────────────────────────────────
// GASプロキシ経由でCORSを回避
const CSV_URL='https://script.google.com/macros/s/AKfycbx2BX2lg1I2yjGHS04a9PpkQELZJbVGQcUlya8HrIbtSk1IXx_anTDPST4NQH-08StF/exec';
 
// ── FETCH FROM SHEETS ─────────────────────────────────────
async function fetchSheetData(){
  const btn=document.getElementById('fetchBtn');
  const icon=document.getElementById('fetchBtnIcon');
  const statusEl=document.getElementById('fetchStatus');
  const statusTxt=document.getElementById('fetchStatusText');
  btn.disabled=true;
  icon.innerHTML='<span class="spin">↻</span>';
  statusEl.className='fetch-status loading';
  statusTxt.textContent='取得中...';
  try{
    const res=await fetch(CSV_URL,{redirect:'follow'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const text=await res.text();
    const parsed=parseFormCSV(text);
    // ヘッダーのみ・回答0件でも正常とみなす
    Object.entries(parsed).forEach(([name,records])=>{
      state.members[name]=records;
      // 既定チーム割当がなければnullで初期化（エディタで後から設定可能）
      if(state.memberTeam[name]===undefined) state.memberTeam[name]=null;
    });
    if(!state.activeMember) state.activeMember=Object.keys(state.members)[0];
    const total=Object.values(state.members).flat().length;
    const names=Object.keys(state.members).length;
    statusEl.className='fetch-status ok';
    statusTxt.textContent=names>0?`${names}名・${total}件 取得完了`:'接続OK・回答待ち';
    updateTeamSummary();
    sdr();
    renderDashboard();
    // save last fetched time
    state.lastFetched=new Date().toLocaleString('ja-JP');
  }catch(e){
    statusEl.className='fetch-status err';

// ── FORM RESPONSE CSV PARSER ──────────────────────────────
function parseFormCSV(text){
  // 改行含みクォートフィールドを正しく処理するトークナイザー
  const rows=tokenizeCSV(text);
  if(rows.length<2) return {};
 
  // ヘッダー行を探す（「報告日」を含む行）
  let headerRowIdx=-1;
  for(let i=0;i<rows.length;i++){
    if(rows[i].some(c=>c.includes('報告日'))){headerRowIdx=i;break;}
  }
  if(headerRowIdx<0) return {};
  const header=rows[headerRowIdx];
 
  // 列インデックス特定
  const iDate=header.findIndex(h=>h.includes('報告日'));
  const iName=header.findIndex(h=>h.includes('報告者名'));
  const iHours=header.findIndex(h=>h.includes('テレアポ稼働時間')&&!h.includes('以外'));
  const iCalls=header.findIndex(h=>h.includes('総架電数')||h.includes('Call数'));
  const iMgrC=header.findIndex(h=>h.includes('責任者')&&h.includes('接触'));
  const iCeoC=header.findIndex(h=>h.includes('社長')&&h.includes('接触'));
  const iMgrA=header.findIndex(h=>h.includes('責任者')&&h.includes('アポ')&&!h.includes('パス'));
  const iCeoA=header.findIndex(h=>h.includes('社長')&&h.includes('アポ')&&!h.includes('パス'));
 
  const memberMap={};
  for(let i=headerRowIdx+1;i<rows.length;i++){
    const r=rows[i];
    if(r.length<3) continue;
    const rawDate=(r[iDate]||'').trim();
    const name=(r[iName]||'').trim();
    if(!rawDate||!name) continue;
    const date=parseDate(rawDate);if(!date) continue;
    const calls=pn(r[iCalls]),hours=parseHours(r[iHours]);
    if(calls===0&&hours===0) continue;
    if(!memberMap[name]) memberMap[name]=[];
    memberMap[name].push({
      date,hours,calls,
      mgrContacts:pn(r[iMgrC]),ceoContacts:pn(r[iCeoC]),
      mgrApos:pn(r[iMgrA]),ceoApos:pn(r[iCeoA]),
    });
  }
  Object.values(memberMap).forEach(arr=>arr.sort((a,b)=>a.date-b.date));
  return memberMap;
}
 
// 改行含みクォートフィールドを正しく処理するCSVトークナイザー
function tokenizeCSV(text){
  const rows=[];let row=[];let cur='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){
      if(inQ&&text[i+1]==='"'){cur+='"';i++;}
      else inQ=!inQ;
    } else if(c===','&&!inQ){
      row.push(cur.trim());cur='';
    } else if((c==='\n'||c==='\r')&&!inQ){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(cur.trim());
      if(row.some(v=>v!=='')) rows.push(row);
      row=[];cur='';
    } else {
      cur+=c;
    }
  }
  if(cur||row.length) {row.push(cur.trim());if(row.some(v=>v!=='')) rows.push(row);}
  return rows;
}
 
function parseCSVLine(line){const res=[];let cur='';let q=false;for(const c of line){if(c==='"'){q=!q;}else if(c===','&&!q){res.push(cur.trim());cur='';}else cur+=c;}res.push(cur.trim());return res;}
function parseDate(s){
  if(!s) return null;
  s=s.trim();
  // 通常形式: "2026/05/01" or "2026-05-01" or "2026年5月1日"
  const s2=s.replace(/\//g,'-').replace(/年/g,'-').replace(/月/g,'-').replace(/日/g,'').trim();
  const m=s2.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  // GAS形式: "Fri May 01 2026 00:00:00 GMT+0900（日本標準時）"
  const d=new Date(s);
  if(!isNaN(d.getTime())) return new Date(d.getFullYear(),d.getMonth(),d.getDate());
  return null;
}
function parseHours(s){
  if(!s||s===''||s==='0') return 0;
  const str=String(s).trim();
  // GAS新形式: "5.00" など小数文字列
  const num=parseFloat(str);
  if(!isNaN(num)&&!/[:]/.test(str)) return num;
  // HH:MM:SS 形式: "5:00:00"
  const hms=str.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
  if(hms) return +hms[1]+(+hms[2])/60+(+hms[3])/3600;
  // HH:MM 形式: "5:00"
  const hm=str.match(/^(\d{1,2}):(\d{2})$/);
  if(hm) return +hm[1]+(+hm[2])/60;
  // GAS旧時間型: "Sat Dec 30 1899 05:37:40 GMT+0900..."
  const gasM=str.match(/1899\s+(\d{1,2}):(\d{2}):(\d{2})/);
  if(gasM) return +gasM[1]+(+gasM[2])/60+(+gasM[3])/3600;
  return 0;
}
function pn(s){
  if(!s) return 0;
  const str=String(s).trim();
  // "なし" や文字列は0
  if(!/[\d.]/.test(str)) return 0;
  const n=parseFloat(str.replace(/[,%¥$時間hｈ]/g,''));
  return isNaN(n)?0:n;
}
function fdi(d){return d.toISOString().slice(0,10);}
function fd(d){return`${d.getMonth()+1}/${d.getDate()}`;}
function fw(d){const s=new Date(d);s.setDate(s.getDate()-s.getDay()+1);return`${s.getMonth()+1}/${s.getDate()}週`;}
function fm(d){return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;}

function gfr(m){
  const from=new Date(document.getElementById('dateFrom').value||'2000-01-01');
  const to=new Date(document.getElementById('dateTo').value||'2099-12-31');to.setHours(23,59,59);
  return(state.members[m]||[]).filter(r=>r.date>=from&&r.date<=to);

function agg(records){
  const bk={};
  records.forEach(r=>{
    let k;
    if(state.period==='daily') k=fdi(r.date);
    else if(state.period==='weekly'){const s=new Date(r.date);s.setDate(s.getDate()-s.getDay()+1);k=fdi(s);}
    else k=fm(r.date);
    if(!bk[k]) bk[k]={calls:0,hours:0,ceoC:0,mgrC:0,ceoA:0,mgrA:0,days:0};
    bk[k].calls+=r.calls;bk[k].hours+=r.hours;bk[k].ceoC+=r.ceoContacts;bk[k].mgrC+=r.mgrContacts;bk[k].ceoA+=r.ceoApos;bk[k].mgrA+=r.mgrApos;bk[k].days++;
  });
  return Object.entries(bk).sort((a,b)=>a[0]<b[0]?-1:1).map(([k,v])=>({
    label:state.period==='daily'?fd(new Date(k)):state.period==='weekly'?fw(new Date(k)):k,
    key:k,...v,contacts:v.ceoC+v.mgrC,apos:v.ceoA+v.mgrA,
    contactRate:v.calls>0?((v.ceoC+v.mgrC)/v.calls*100):0,
    callApoRate:v.calls>0?((v.ceoA+v.mgrA)/v.calls*100):0,
    callsPerHour:v.hours>0?(v.calls/v.hours):0,
  }));
}
function ss(records){
  const s={calls:0,hours:0,ceoC:0,mgrC:0,ceoA:0,mgrA:0,days:0};
  records.forEach(r=>{s.calls+=r.calls;s.hours+=r.hours;s.ceoC+=r.ceoContacts;s.mgrC+=r.mgrContacts;s.ceoA+=r.ceoApos;s.mgrA+=r.mgrApos;s.days++;});
  s.contacts=s.ceoC+s.mgrC;s.apos=s.ceoA+s.mgrA;
  s.contactRate=s.calls>0?(s.contacts/s.calls*100):0;
  s.callApoRate=s.calls>0?(s.apos/s.calls*100):0;
  s.contactApoRate=s.contacts>0?(s.apos/s.contacts*100):0;
  s.callsPerHour=s.hours>0?(s.calls/s.hours):0;
  s.callsPerDay=s.days>0?(s.calls/s.days):0;
  s.aposPerDay=s.days>0?(s.apos/s.days):0;
  return s;
}

// ── TEAM EDITOR ──────────────────────────────────────────
let editorState={teams:{},memberTeam:{},memberApoTarget:{}};// working copy
let dragMember=null;
 
function openEditor(){
  editorState.teams=JSON.parse(JSON.stringify(state.teams));
  editorState.memberTeam=JSON.parse(JSON.stringify(state.memberTeam));
  editorState.memberApoTarget=JSON.parse(JSON.stringify(state.memberApoTarget));
  renderEditor();
  document.getElementById('editorOverlay').style.display='flex';
}
function closeEditor(){document.getElementById('editorOverlay').style.display='none';}
function applyTeams(){
  state.teams=JSON.parse(JSON.stringify(editorState.teams));
  state.memberTeam=JSON.parse(JSON.stringify(editorState.memberTeam));
  state.memberApoTarget=JSON.parse(JSON.stringify(editorState.memberApoTarget));
  // 新規メンバー（フォームから追加された未登録者）をmemberTeamに追加
  Object.keys(state.members).forEach(m=>{if(state.memberTeam[m]===undefined) state.memberTeam[m]=null;});
  updateTeamSummary();
  closeEditor();
  renderDashboard();
}
 
function renderEditor(){
  // unassigned
  const pool=document.getElementById('unassignedPool');
  pool.innerHTML='';
  Object.keys(state.members).filter(m=>!editorState.memberTeam[m]).forEach(m=>{pool.appendChild(makeChip(m,null));});
 
  // teams
  const teTeams=document.getElementById('teTeams');
  teTeams.innerHTML='';
  Object.entries(editorState.teams).forEach(([tid,t])=>{
    const slot=document.createElement('div');
    slot.className='te-team-slot';slot.dataset.tid=tid;
    slot.innerHTML=`
      <div class="te-team-header">
        <span class="te-team-color" style="background:${t.color}"></span>
        <input class="te-team-name-input" value="${t.name}" placeholder="チーム名" oninput="editorState.teams['${tid}'].name=this.value">
        <button class="te-team-delete" onclick="deleteTeam('${tid}')" title="チームを削除">✕</button>
      </div>
      <div class="te-team-members" id="slot_${tid}"></div>`;
    slot.querySelector('.te-team-members').addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drag-over');});
    slot.querySelector('.te-team-members').addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
    slot.querySelector('.te-team-members').addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('drag-over');dropMember(tid);});
    teTeams.appendChild(slot);
    // fill members
    const membersEl=slot.querySelector('.te-team-members');
    Object.entries(editorState.memberTeam).filter(([,v])=>v===tid).forEach(([m])=>membersEl.appendChild(makeChip(m,tid)));
  });
}
function makeChip(name,tid){
  const color=tid&&editorState.teams[tid]?editorState.teams[tid].color:'#888';
  const chip=document.createElement('div');
  chip.className='m-chip';chip.draggable=true;chip.dataset.member=name;
  const tgt=editorState.memberApoTarget[name]!==undefined?editorState.memberApoTarget[name]:'';
  chip.innerHTML=`<span class="m-chip-avatar" style="background:${color}22;color:${color}">${memberInitial(name)}</span>${name}<input type="number" class="tgt-input" value="${tgt}" min="0" step="0.5" placeholder="目標" title="月次アポ目標" onclick="event.stopPropagation()" oninput="editorState.memberApoTarget['${name}']=parseFloat(this.value)||0">`;
  chip.addEventListener('dragstart',e=>{dragMember=name;chip.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  chip.addEventListener('dragend',()=>{dragMember=null;chip.classList.remove('dragging');});
  return chip;
}
function dropMember(targetTid){
  if(!dragMember) return;
  editorState.memberTeam[dragMember]=targetTid;
  renderEditor();
}
function onDragOver(e,tid){e.preventDefault();const el=tid?document.getElementById('slot_'+tid):document.getElementById('unassignedPool');if(el) el.classList.add('drag-over');}
function onDragLeave(e){document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));}
function onDrop(e,tid){e.preventDefault();document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));dropMember(tid);}
function addTeam(){
  const tid='t'+Date.now();
  const usedColors=Object.values(editorState.teams).map(t=>t.color);
  const color=TEAM_COLORS.find(c=>!usedColors.includes(c))||TEAM_COLORS[Object.keys(editorState.teams).length%TEAM_COLORS.length];
  editorState.teams[tid]={name:`チーム${Object.keys(editorState.teams).length+1}`,color};
  renderEditor();
}
function deleteTeam(tid){
  Object.keys(editorState.memberTeam).forEach(m=>{if(editorState.memberTeam[m]===tid) editorState.memberTeam[m]=null;});

  renderEditor();
}
